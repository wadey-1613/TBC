<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deal Finder</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1c1b29;--mute:#6b6a7c;--acc:#6d3df5;--ok:#0c8a4f;--line:#e4e2ef}
@media(prefers-color-scheme:dark){:root{--bg:#14131c;--card:#1e1d2b;--ink:#f1f0fa;--mute:#9b9aae;--acc:#9a78ff;--ok:#3ccf8a;--line:#2f2e42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 12px}
form{display:grid;gap:8px;background:var(--card);padding:12px;border-radius:12px;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--acc);color:#fff;border:0;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.note{color:var(--mute);font-size:.85rem;margin:8px 0}
.res{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;text-decoration:none;color:inherit}
.img{width:72px;height:72px;border-radius:8px;background:var(--line) center/cover}
.t{font-weight:600}.m{color:var(--mute);font-size:.85rem}
.p{font-size:1.2rem;font-weight:700;text-align:right}
.s{display:inline-block;background:var(--ok);color:#fff;border-radius:99px;padding:2px 8px;font-size:.8rem;font-weight:700}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin:2px 4px 0 0;font-size:.75rem;color:var(--mute)}
canvas{width:100%;height:80px}
</style></head><body><main>
<h1>🔎 Deal Finder</h1>
<form id="f">
  <input id="text" placeholder="e.g. girls bike purple under £120" required autofocus>
  <div class="row">
    <input id="max" type="number" min="1" placeholder="Max £ (optional)">
    <input id="colour" placeholder="Colour (optional)">
    <select id="cond"><option value="any">New &amp; used</option><option value="new">New only</option><option value="used">Used only</option></select>
  </div>
  <div class="row"><button>Find deals</button><button type="button" class="ghost" id="alert">🔔 Alert me</button></div>
</form>
<div id="status" class="note"></div>
<div id="hist"></div>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);let last=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('f').onsubmit=async e=>{e.preventDefault();$('status').textContent='Searching…';$('out').innerHTML='';
  const r=await fetch('/api/search',{method:'POST',body:JSON.stringify({text:$('text').value,maxPrice:$('max').value,colour:$('colour').value,condition:$('cond').value})});
  const d=await r.json();if(!r.ok){$('status').textContent=d.error;return}
  last=d.query;const q=d.query;
  $('status').textContent=`${d.results.length} deals for “${q.keywords}${q.colour?' · '+q.colour:''}${q.maxPrice?' · ≤£'+q.maxPrice:''}” from ${Object.entries(d.bySource).map(([k,v])=>k+' ('+v+')').join(', ')||d.sources.join(', ')}`+(d.demo?' — DEMO DATA (set EBAY_CLIENT_ID/EBAY_CLIENT_SECRET for live results)':'')+(d.errors.length?' — '+d.errors.join('; '):'');
  $('out').innerHTML=d.results.map(x=>`<a class="res" href="${esc(x.url)}" target="_blank" rel="noopener">
    <div class="img" style="${x.image?`background-image:url('${esc(x.image)}')`:''}"></div>
    <div><div class="t">${esc(x.title)}</div><div class="m">${esc(x.source)} · ${x.condition}${x.shipping?` · +£${x.shipping} postage`:' · free postage'}</div>
    <div>${x.reasons.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>
    <div><div class="p">£${x.total}</div><span class="s">${x.score}</span></div></a>`).join('');
  drawHist(d.series)};
$('alert').onclick=async()=>{if(!last)return $('status').textContent='Run a search first';
  const email=prompt('Email for alerts (optional, currently logged on the server):')??'';
  await fetch('/api/alerts',{method:'POST',body:JSON.stringify({query:last,email})});$('status').textContent='Alert saved — checked every 30 min.'};
function drawHist(s){const h=$('hist');if(s.length<2){h.innerHTML='';return}
  h.innerHTML='<div class="note">Cheapest listing per day</div><canvas id="c"></canvas>';
  const c=$('c'),x=c.getContext('2d'),W=c.width=c.clientWidth*2,H=c.height=160,v=s.map(p=>p.min),lo=Math.min(...v),hi=Math.max(...v)||1;
  x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--acc')||'#6d3df5';x.lineWidth=3;x.beginPath();
  v.forEach((y,i)=>{const px=i/(v.length-1)*(W-10)+5,py=H-10-((y-lo)/((hi-lo)||1))*(H-20);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
</script></body></html>
